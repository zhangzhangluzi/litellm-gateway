# LiteLLM unified gateway config. Keys referenced via os.environ/ only.
model_list:
  # ---- specific aliases ----
  - model_name: gpt-oss-120b-groq
    litellm_params: {model: groq/openai/gpt-oss-120b, api_key: os.environ/GROQ_API_KEY}
  - model_name: nemotron-openrouter
    litellm_params: {model: openrouter/nvidia/nemotron-3.5-lightning:free, api_key: os.environ/OPENROUTER_API_KEY}
  - model_name: gemma-4-31b-openrouter
    litellm_params: {model: openrouter/google/gemma-4-31b-it:free, api_key: os.environ/OPENROUTER_API_KEY}
  - model_name: gemini-3.5-flash
    litellm_params: {model: gemini/gemini-3.5-flash, api_key: os.environ/GEMINI_API_KEY}
  - model_name: glm-4.5-flash
    litellm_params: {model: openai/glm-4.5-flash, api_base: "https://api.z.ai/api/paas/v4/", api_key: os.environ/ZAI_API_KEY}
  - model_name: solar-mini
    litellm_params: {model: openai/solar-mini4, api_base: "https://api.upstage.ai/v1", api_key: os.environ/UPSTAGE_API_KEY}
  - model_name: command-a
    litellm_params: {model: openai/command-a-03-2025, api_base: "https://api.cohere.ai/compatibility/v1", api_key: os.environ/COHERE_API_KEY}
  - model_name: gpt-oss-120b-cerebras
    litellm_params: {model: openai/gpt-oss-120b, api_base: "https://api.cerebras.ai/v1", api_key: os.environ/CEREBRAS_API_KEY}
  - model_name: nemotron-nvidia
    litellm_params: {model: openai/nvidia/nemotron-3.5-lightning-30b-a3b, api_base: "https://integrate.api.nvidia.com/v1", api_key: os.environ/NVIDIA_API_KEY}
  - model_name: mistral-small
    litellm_params: {model: openai/mistral-small-latest, api_base: "https://api.mistral.ai/v1", api_key: os.environ/MISTRAL_API_KEY}
  - model_name: llama-3.3-70b-cloudflare
    # CLOUDFLARE_API_BASE is built from CLOUDFLARE_ACCOUNT_ID by litellm-start.sh
    litellm_params: {model: "openai/@cf/meta/llama-3.3-70b-instruct-fp8-fast", api_base: os.environ/CLOUDFLARE_API_BASE, api_key: os.environ/CLOUDFLARE_API_TOKEN}
  # ---- free-auto: load-balanced pool (simple-shuffle) ----
  - model_name: free-auto
    litellm_params: {model: groq/openai/gpt-oss-120b, api_key: os.environ/GROQ_API_KEY}
  - model_name: free-auto
    litellm_params: {model: openrouter/nvidia/nemotron-3.5-lightning:free, api_key: os.environ/OPENROUTER_API_KEY}
  - model_name: free-auto
    litellm_params: {model: gemini/gemini-3.5-flash, api_key: os.environ/GEMINI_API_KEY}

  # ---- free-fast: fast pool for quick replies ----
  - model_name: free-fast
    litellm_params: {model: groq/openai/gpt-oss-120b, api_key: os.environ/GROQ_API_KEY, timeout: 30, order: 1}
  - model_name: free-fast
    litellm_params: {model: openai/gpt-oss-120b, api_base: "https://api.cerebras.ai/v1", api_key: os.environ/CEREBRAS_API_KEY, timeout: 30, order: 2}  # B: credit, used only when groq fails

  # ---- free-cn: Chinese-friendly pool (glm-4.5-flash) ----
  - model_name: free-cn
    litellm_params: {model: openai/glm-4.5-flash, api_base: "https://api.z.ai/api/paas/v4/", api_key: os.environ/ZAI_API_KEY}

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2          # single place for retries (removed duplicate from litellm_settings)
  timeout: 60             # free-fast deployments override with 30
  allowed_fails: 2
  cooldown_time: 60
  retry_policy:
    AuthenticationErrorRetries: 0
    BadRequestErrorRetries: 0
    RateLimitErrorRetries: 1
    TimeoutErrorRetries: 1
    InternalServerErrorRetries: 2
  allowed_fails_policy:
    RateLimitErrorAllowedFails: 1     # cool down on first 429, switch provider
    BadRequestErrorAllowedFails: 1000
  # Fallback order: A (pure free, other provider) -> B (credit/trial) -> other A.
  # Flat lists of single models only (no pool/group refs) => no loops; no self refs.
  # A: gpt-oss-120b-groq, nemotron-openrouter, gemini-3.5-flash, glm-4.5-flash, nemotron-nvidia
  # B: gpt-oss-120b-cerebras, command-a, solar-mini, llama-3.3-70b-cloudflare
  # C (not in chains, 429 at test time): gemma-4-31b-openrouter, mistral-small
  fallbacks:
    - free-auto: [glm-4.5-flash, nemotron-nvidia, gpt-oss-120b-cerebras, command-a, solar-mini, llama-3.3-70b-cloudflare]
    - free-fast: [nemotron-openrouter, nemotron-nvidia, llama-3.3-70b-cloudflare, solar-mini, gemini-3.5-flash]
    - free-cn: [gemini-3.5-flash, gpt-oss-120b-groq, command-a, solar-mini, nemotron-nvidia]
    - gpt-oss-120b-groq: [nemotron-nvidia, gpt-oss-120b-cerebras, command-a, gemini-3.5-flash]
    - gpt-oss-120b-cerebras: [gpt-oss-120b-groq, nemotron-nvidia, command-a, gemini-3.5-flash]
    - nemotron-openrouter: [nemotron-nvidia, llama-3.3-70b-cloudflare, solar-mini, gpt-oss-120b-groq]
    - nemotron-nvidia: [nemotron-openrouter, llama-3.3-70b-cloudflare, solar-mini, gpt-oss-120b-groq]
    - gemini-3.5-flash: [gpt-oss-120b-groq, glm-4.5-flash, command-a, gpt-oss-120b-cerebras, nemotron-nvidia]
    - glm-4.5-flash: [gemini-3.5-flash, gpt-oss-120b-groq, command-a, solar-mini, nemotron-nvidia]
    - gemma-4-31b-openrouter: [gemini-3.5-flash, nemotron-openrouter, command-a, gpt-oss-120b-groq]
    - mistral-small: [gemini-3.5-flash, gpt-oss-120b-groq, command-a, solar-mini, glm-4.5-flash]
    - command-a: [gpt-oss-120b-groq, gemini-3.5-flash, solar-mini, gpt-oss-120b-cerebras]
    - solar-mini: [nemotron-nvidia, gpt-oss-120b-groq, command-a, llama-3.3-70b-cloudflare]
    - llama-3.3-70b-cloudflare: [gpt-oss-120b-groq, nemotron-openrouter, solar-mini, command-a]

litellm_settings:
  drop_params: true
  turn_off_message_logging: true
  request_timeout: 60

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  background_health_checks: true
  health_check_interval: 900   # seconds; each check hits every deployment (uses free quota)
  # Virtual-key rate limits need a DB (--profile with-db); intentionally NOT enabled:
  # database_url: os.environ/DATABASE_URL
