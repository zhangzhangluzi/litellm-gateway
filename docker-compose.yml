# LiteLLM unified free-AI gateway — VPS scaffold
# Official image: ghcr.io/berriai/litellm (mirrored at docker.litellm.ai/berriai)
# Pin a release tag; do NOT use :latest in production.
# Latest checked 2026-11-03: v1.106.6
#
# Architecture (greenfield): Caddy (80/443 HTTPS) -> litellm:4000 (internal only)
# If host 80/443 are busy: use docker-compose.tunnel.yml (CF Tunnel -> 127.0.0.1:4000)
# No Ollama. Config-driven. Optional Postgres profile below.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.106.6
    container_name: litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    env_file: .env
    environment:
      CLOUDFLARE_API_BASE: "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1"
      # Bound temp/cache under container filesystem; prune via docker
      TMPDIR: /tmp
      LITELLM_LOG: "INFO"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    expose:
      - "4000"
    networks:
      - litellm_net
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2.9-alpine
    container_name: litellm-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      litellm:
        condition: service_healthy
    networks:
      - litellm_net
    logging: *default-logging

  db:
    profiles: ["with-db"]
    image: postgres:16-alpine
    container_name: litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      # No default. The official Postgres image refuses to init when this is empty.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: litellm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - litellm_net
    logging: *default-logging

networks:
  litellm_net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
